[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mail-autodiscover"
version = "0.3.3"
description = "Lightweight Outlook Autodiscover, Thunderbird Autoconfig and Apple Mail profile service for self-hosted mail servers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7.1",
    "fastapi>=0.115.0",
    "pydantic-settings>=2.6.0",
    "PyYAML>=6.0.2",
    "uvicorn[standard]>=0.32.0",
]

# Split by concern so each CI job installs only what it actually runs
# (test/lint/typecheck/security), instead of every job paying for the full
# dev toolchain. `dev` still pulls in everything for local setup via the
# self-referencing extra below (verified pip resolves this correctly).
[project.optional-dependencies]
test = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
]
lint = [
    # Pinned exactly, matching .pre-commit-config.yaml's `rev:` -- CI and
    # pre-commit must run the same ruff version so a rule added upstream
    # can't pass in one and fail in the other.
    "ruff==0.16.6",
]
typecheck = [
    "mypy>=1.13.0",
]
security = [
    "bandit>=1.8.0",
    "deptry>=0.23.0",
    "pip-audit>=2.7.0",
]
dev = [
    "mail-autodiscover[test,lint,typecheck,security]",
    "pip-tools>=7.4.0",
    "pre-commit>=4.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
include = ["app/static/**"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=90"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.deptry]
ignore = ["DEP003"]

[tool.deptry.per_rule_ignores]
DEP002 = [
    "uvicorn",
    # `dev`'s self-reference to this project's own other extras
    # (mail-autodiscover[test,lint,typecheck,security]) reads to deptry as a
    # declared dependency on the package itself, which it never imports.
    "mail-autodiscover",
    "bandit",
    "deptry",
    "httpx",
    "mypy",
    "pip-audit",
    "pip-tools",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
]
