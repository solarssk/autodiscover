[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mail-autodiscover"
version = "0.3.3"
description = "Lightweight Outlook Autodiscover, Thunderbird Autoconfig and Apple Mail profile service for self-hosted mail servers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7.1",
    "fastapi>=0.115.0",
    "pydantic-settings>=2.6.0",
    "PyYAML>=6.0.2",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.8.0",
    "deptry>=0.23.0",
    "httpx>=0.28.0",
    "mypy>=1.13.0",
    "pip-audit>=2.7.0",
    "pip-tools>=7.4.0",
    "pre-commit>=4.2.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
include = ["app/static/**"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=90"
# Narrowly scoped, not a blanket "ignore::DeprecationWarning": that used to
# silence any DeprecationWarning repo-wide, including ones from our own code.
# The only DeprecationWarning currently raised in this suite comes from
# starlette.testclient importing the deprecated `anyio.abc.BlockingPortal`
# alias (starlette/testclient.py:53) -- a third-party issue, fixed upstream
# once Starlette updates the import, not something this repo can act on.
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.deptry]
ignore = ["DEP003"]

[tool.deptry.per_rule_ignores]
DEP002 = [
    "uvicorn",
    "bandit",
    "deptry",
    "httpx",
    "mypy",
    "pip-audit",
    "pip-tools",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
]
