name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Compute scan range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "range=origin/${{ github.base_ref }}..HEAD" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "range=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "range=-1" >> "$GITHUB_OUTPUT"
          fi

      - name: gitleaks (scoped to this run's commits)
        run: gitleaks detect --source . --log-opts="${{ steps.range.outputs.range }}" --exit-code 1

  docs-impact:
    name: Documentation impact declaration
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/check_pr_docs_impact.py

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check .

  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          # SonarCloud's scan below needs full history (not the default
          # shallow clone) to attribute new-vs-existing code by git blame.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[dev]"
      - run: pytest -v --junitxml=junit.xml

      # "Tests and coverage" is a required status check, but Codecov/SonarCloud
      # are documented as report-only signals, not merge gates, at this stage.
      # continue-on-error makes that true regardless of what each action's own
      # exit code does: an external-service hiccup (Codecov down, a transient
      # SonarCloud error) must not fail this required job.
      - name: Upload coverage to Codecov
        # Fork and Dependabot PRs can't read repo secrets; tests still run either way.
        if: ${{ env.CODECOV_TOKEN != '' }}
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        continue-on-error: true
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3  # v1.2.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: junit.xml

      # CI-based analysis (sonar-project.properties), not SonarCloud's
      # Automatic Analysis; the two are mutually exclusive. Automatic
      # Analysis must be turned off in the SonarCloud project settings
      # (Administration -> Analysis Method) or it silently overrides this
      # scan, or makes this step fail outright.
      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f  # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[dev]"
      - run: mypy app

  security:
    name: Security (bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade "pip>=26.1.2"
      - run: pip install ".[dev]"
      - run: bandit -r app -ll -c pyproject.toml
      - run: pip-audit
      - run: deptry .

  dependency-lock:
    name: Verify requirements.txt matches pyproject.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      # Must match the Dockerfile's base image Python version (3.14), not the
      # 3.12 used elsewhere in this file for running dev tools: pip-compile
      # resolves environment-marker-conditional transitive dependencies using
      # the interpreter it runs under, so a different Python version here can
      # reproduce a spuriously different lockfile even when pyproject.toml
      # hasn't changed.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      # Pinned exactly (unlike pyproject.toml's own pip-tools>=7.4.0 floor for
      # local dev use): pip-tools has a header-rendering bug where an unset
      # --no-index defaults to a sentinel that never compares equal to its own
      # False default, so it always echoes "--no-index" into the generated
      # file's header regardless of whether the index was actually used.
      # Harmless today (deterministic per pip-tools version), but an unpinned
      # future pip-tools release changing that rendering could shift the
      # header and break the diff below for a reason unrelated to any real
      # dependency change.
      - run: pip install "pip-tools==7.6.1"
      # pip-compile keeps existing pins from requirements.txt when they still
      # satisfy pyproject.toml, so re-running it without --upgrade reproduces
      # the same file unless pyproject.toml's own constraints changed without
      # regenerating the lock to match.
      - name: Verify requirements.txt matches pyproject.toml
        run: |
          pip-compile --generate-hashes --allow-unsafe -o requirements.txt pyproject.toml
          git diff --exit-code requirements.txt

  docker:
    name: Docker build and scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build -t mail-autodiscover:ci .

      - name: Scan image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: mail-autodiscover:ci
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        env:
          TRIVY_CACHE_DIR: /tmp/trivy-cache

      - name: Upload Trivy scan results to Security tab
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4.36.2
        if: always()
        with:
          sarif_file: trivy-results.sarif
