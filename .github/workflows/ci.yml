name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Compute scan range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "range=origin/${{ github.base_ref }}..HEAD" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "range=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "range=-1" >> "$GITHUB_OUTPUT"
          fi

      - name: gitleaks (scoped to this run's commits)
        run: gitleaks detect --source . --log-opts="${{ steps.range.outputs.range }}" --exit-code 1

  docs-impact:
    name: Documentation impact declaration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/check_pr_docs_impact.py

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      # Pinned via the `lint` extra (matches .pre-commit-config.yaml's `rev:`)
      # instead of a bare `pip install ruff`, so CI and pre-commit can't drift
      # to different ruff versions -- a rule added upstream under an
      # already-selected prefix (e.g. "B") would otherwise start failing in
      # one and not the other.
      - run: pip install ".[lint]"
      - run: ruff check .

  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      # Only what pytest itself needs (pytest, pytest-cov, httpx for
      # TestClient) -- mypy/bandit/ruff/etc. live in their own extras and
      # their own jobs now, so this required job isn't paying to install
      # tools it never runs.
      - run: pip install ".[test]"
      - run: pytest -v --junitxml=junit.xml

      # "Tests and coverage" is a required status check, but Codecov is a
      # documented report-only signal, not a merge gate, at this stage.
      # continue-on-error makes that true regardless of what the action's
      # own exit code does: an external-service hiccup (Codecov down) must
      # not fail this required job.
      - name: Upload coverage to Codecov
        # Fork and Dependabot PRs can't read repo secrets; tests still run either way.
        if: ${{ env.CODECOV_TOKEN != '' }}
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        continue-on-error: true
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3  # v1.2.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: junit.xml

  # Split out of "Tests and coverage" (which IS a required status check):
  # the Sonar scan itself routinely took ~46s -- almost as long as the rest
  # of that job combined -- and continue-on-error only stops a Sonar failure
  # from failing the required job, it does nothing about that job's runtime
  # having to include the scan's full duration, since steps in a job run
  # sequentially. Moving it to its own, non-required job means the required
  # job reports back as soon as pytest + Codecov are done, while Sonar still
  # runs (in parallel, not blocking merge) and reports its own findings.
  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # SonarCloud's scan needs full history (not the default shallow
          # clone) to attribute new-vs-existing code by git blame.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[test]"
      # sonar-project.properties' sonar.python.xunit.reportPath=junit.xml
      # needs this job's own junit.xml -- this is a separate runner from the
      # "test" job, so its report isn't produced here just because the other
      # job's pytest run wrote one.
      - run: pytest -v --junitxml=junit.xml

      # CI-based analysis (sonar-project.properties), not SonarCloud's
      # Automatic Analysis; the two are mutually exclusive. Automatic
      # Analysis must be turned off in the SonarCloud project settings
      # (Administration -> Analysis Method) or it silently overrides this
      # scan, or makes this step fail outright.
      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f  # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[typecheck]"
      - run: mypy app

  security:
    name: Security (bandit + pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade "pip>=26.1.2"
      - run: pip install ".[security]"
      - run: bandit -r app -ll -c pyproject.toml
      # Scoped to requirements.txt -- the exact hash-pinned runtime lockfile
      # that Dockerfile installs with --require-hashes -- instead of a bare
      # `pip-audit`, which would scan whatever happens to be installed in
      # this job's own environment (bandit, deptry, pip-audit itself, and
      # their transitive deps) rather than what actually ships in the image.
      - run: pip-audit -r requirements.txt
      - run: deptry .

  dependency-lock:
    name: Verify requirements.txt matches pyproject.toml
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Must match the Dockerfile's base image Python version (3.14), not the
      # 3.12 used elsewhere in this file for running dev tools: pip-compile
      # resolves environment-marker-conditional transitive dependencies using
      # the interpreter it runs under, so a different Python version here can
      # reproduce a spuriously different lockfile even when pyproject.toml
      # hasn't changed.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      # Pinned exactly (unlike pyproject.toml's own pip-tools>=7.4.0 floor for
      # local dev use): pip-tools has a header-rendering bug where an unset
      # --no-index defaults to a sentinel that never compares equal to its own
      # False default, so it always echoes "--no-index" into the generated
      # file's header regardless of whether the index was actually used.
      # Harmless today (deterministic per pip-tools version), but an unpinned
      # future pip-tools release changing that rendering could shift the
      # header and break the diff below for a reason unrelated to any real
      # dependency change.
      - run: pip install "pip-tools==7.6.1"
      # pip-compile keeps existing pins from requirements.txt when they still
      # satisfy pyproject.toml, so re-running it without --upgrade reproduces
      # the same file unless pyproject.toml's own constraints changed without
      # regenerating the lock to match.
      - name: Verify requirements.txt matches pyproject.toml
        run: |
          pip-compile --generate-hashes --allow-unsafe -o requirements.txt pyproject.toml
          git diff --exit-code requirements.txt

  compat:
    name: Compatibility tests (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The Dockerfile's runtime image is python:3.14-slim-bookworm, but
      # every other job here runs the dev toolchain on 3.12 (this repo's
      # requires-python floor). Without this job, the actual production
      # interpreter is never exercised by the test suite -- only used to
      # regenerate requirements.txt in dependency-lock, which never imports
      # or runs app code.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install ".[test]"
      - run: pytest -q

  docker:
    name: Docker build and scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build -t mail-autodiscover:ci .

      # Catches the class of bug that build success + a clean CVE scan both
      # miss: the image builds, its dependencies are fine, but the container
      # doesn't actually come up (bad CMD, an env var the app now requires,
      # a broken entrypoint). Uses the same non-placeholder-rejecting
      # APP_ENV=development mode documented in AGENTS.md for local dev, since
      # this is a build-time sanity check, not a production config.
      - name: Smoke-test the built image
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 18080:8000 \
            -e APP_ENV=development \
            -e ALLOWED_DOMAINS=example.com \
            -e IMAP_HOST=mail.example.com \
            -e SMTP_HOST=mail.example.com \
            mail-autodiscover:ci

          ready=false
          for _ in $(seq 1 20); do
            if curl -fsS http://localhost:18080/health >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            echo "::error::Container never became healthy" >&2
            docker logs smoke || true
            exit 1
          fi

          curl -fsS http://localhost:18080/health
          curl -fsS http://localhost:18080/ready
          curl -fsS "http://localhost:18080/mail/config-v1.1.xml?emailaddress=user@example.com" \
            | grep -q "<domain>example.com</domain>"

      - name: Show smoke-test container logs
        if: always()
        run: docker logs smoke || true

      - name: Stop smoke-test container
        if: always()
        run: docker rm -f smoke || true

      - name: Scan image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: mail-autodiscover:ci
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        env:
          TRIVY_CACHE_DIR: /tmp/trivy-cache

      - name: Upload Trivy scan results to Security tab
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4.36.2
        if: always()
        with:
          sarif_file: trivy-results.sarif
