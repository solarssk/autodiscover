name: Publish Container

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

# Concurrency is set per job below, not once here for the whole workflow --
# `build`/`manifest` (main pushes) and `promote` (version tags) need
# different keys. See each job's own comment for why.

permissions:
  contents: write
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKERHUB_IMAGE: docker.io/${{ github.repository }}

jobs:
  # Runs only for a push to main: this is the ONLY place a real `docker
  # build` happens. A version-tag push (or a `--ref vX.Y.Z` dispatch, same
  # thing release.yml uses) never lands here -- see the `promote` job below.
  # Splitting each platform into its own matrix job (instead of one job
  # building both sequentially) lets amd64 and arm64 build, scan, and gate
  # concurrently: verified against a real run that the two platforms'
  # build+scan+gate chains took ~25s and ~27s back-to-back (~52s total) on
  # top of ~27s of shared one-time setup, so running them in parallel
  # collapses that ~52s to ~27s. No cost trade-off to weigh here: this repo
  # is public, so GitHub-hosted runner minutes for it are free.
  #
  # Grouped per COMMIT, not per ref: every push to `main` shares the exact
  # same `github.ref` ("refs/heads/main"), so a per-ref group here would
  # have the same "only one running + one pending" problem release.yml's
  # own concurrency comment already covers for a different workflow -- if a
  # release commit's build is still pending when a *third*, unrelated push
  # lands, GitHub Actions evicts the release's queued run to make room, and
  # it silently never builds. The `promote` job below then polls forever
  # for a `sha-<short>` tag that no run will ever create. Per-commit groups
  # make that impossible: this build can only ever be evicted by a retry of
  # the exact same commit, and every commit gets to build.
  #
  # The trade-off: with builds no longer strictly serialized against each
  # other, two different commits' `manifest` jobs (below) could finish in
  # a different order than they were pushed, so writing `latest`
  # unconditionally could leave it pointing at the older of the two. The
  # `manifest` job below checks that its commit is still main's tip
  # immediately before writing `latest` to close that window instead.
  build:
    name: Build & scan (linux/${{ matrix.arch }})
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: docker-publish-build-${{ github.sha }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a  # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only used for this build's OCI labels -- tags are computed in the
      # manifest job below, once, from the digests both matrix legs produce.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Pushed by digest (unreferenced by any tag yet), and that same digest
      # is what gets scanned below and later composed into the real tags --
      # never a rebuild for either purpose.
      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # docker/build-push-action's reported digest is an OCI index (the real
      # image plus a separate build-provenance attestation manifest, added by
      # buildx's default provenance since v0.10) rather than a single image
      # manifest. Without TRIVY_PLATFORM, Trivy resolves a multi-manifest
      # reference by matching the scanning host's own platform -- pinned
      # explicitly so it doesn't depend on which architecture happens to run
      # this matrix leg.
      - name: Trivy scan (SARIF, always uploaded)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        env:
          TRIVY_PLATFORM: linux/${{ matrix.arch }}
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.arch }}.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true

      - uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4.36.2
        if: always()
        with:
          sarif_file: trivy-${{ matrix.arch }}.sarif
          category: trivy-${{ matrix.arch }}

      # Hard gate: fails this matrix leg, before the manifest job below ever
      # runs (needs: build requires every matrix leg to succeed), on fixable
      # HIGH/CRITICAL findings (playbook's Tier 2 requirement). The digest
      # above already exists in the registry at this point, but isn't
      # referenced by any tag, so it's unreachable to anyone pulling
      # `:latest` or a version tag.
      - name: Trivy gate (fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        env:
          TRIVY_PLATFORM: linux/${{ matrix.arch }}
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # Matrix job outputs don't reliably reach a dependent job (GitHub
      # Actions only exposes the last-finishing leg's `outputs:` value, not
      # both) -- passed via a small artifact per architecture instead, which
      # the manifest job below downloads and reads.
      - name: Save digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}.digest"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}.digest
          retention-days: 1

  # Only reached once every matrix leg above (both platforms' gates) passed.
  # Composes the real, user-visible tags (latest, sha-*) directly from the
  # already-scanned digests -- never a rebuild.
  manifest:
    name: Publish tags (GHCR + Docker Hub)
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Per commit, matching `build` above -- so this run is never evicted by
    # an unrelated commit's manifest job either.
    concurrency:
      group: docker-publish-manifest-${{ github.sha }}
      cancel-in-progress: false
    steps:
      # A fresh runner, unlike the build job's steps above -- imagetools
      # create/inspect need a buildx builder context, which isn't assumed
      # present without this, even though no actual `docker build` happens
      # in this job (no QEMU needed either, for the same reason).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # DOCKERHUB_TOKEN is a Docker Hub access token (Account Settings ->
      # Security), not the account password. Same discipline as GITHUB_TOKEN
      # above: scoped, revocable, never the real credential.
      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `build`/`manifest` now run per-commit (see the concurrency comments
      # above), so two different commits' manifest jobs are no longer
      # guaranteed to finish in push order. `sha-<short>` is commit-specific
      # and always safe to publish regardless of ordering, but `latest` is
      # the one genuinely shared, mutable name -- writing it unconditionally
      # could leave it pointing at whichever commit's job happened to finish
      # last, not whichever was actually pushed last. Checking main's
      # current tip immediately before the write closes that window (bar
      # the few seconds between this check and the actual write below,
      # which would need a second push to land in that exact instant).
      - name: Check whether this commit is still the tip of main
        id: tip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current_tip="$(gh api "repos/${{ github.repository }}/commits/main" --jq '.sha')"
          if [ "$current_tip" = "${{ github.sha }}" ]; then
            echo "is_tip=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_tip=false" >> "$GITHUB_OUTPUT"
            echo "::warning::${{ github.sha }} is no longer main's tip (now ${current_tip}) -- a" \
                 "newer commit's build is racing this one. Skipping 'latest' so it doesn't end up" \
                 "pointing at the older of the two; sha-<short> below is commit-specific and" \
                 "unaffected." >&2
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ steps.tip.outputs.is_tip == 'true' }}
            type=sha,format=short

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      # --metadata-file captures the merged manifest's own digest so the
      # Docker Hub copy below has a stable, precise reference instead of
      # re-reading a floating tag that a concurrent run could have already
      # moved.
      - name: Create and push multi-arch manifest (GHCR)
        id: manifest
        run: |
          set -euo pipefail
          amd64_digest="$(cat /tmp/digests/amd64.digest)"
          arm64_digest="$(cat /tmp/digests/arm64.digest)"
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args+=(--tag "$tag")
          done <<< "${{ steps.meta.outputs.tags }}"
          docker buildx imagetools create --metadata-file manifest.json "${tag_args[@]}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${amd64_digest}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${arm64_digest}"
          digest="$(jq -r '."containerimage.descriptor".digest // empty' manifest.json)"
          [ -n "$digest" ] || { echo "::error::could not resolve merged manifest digest from metadata file"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Docker Hub is never a build target: BuildKit's image exporter takes
      # one `name=` per invocation, so a second registry can't be fanned out
      # to from the per-platform builds without building twice. This is a
      # registry-to-registry copy of the exact manifest GHCR just received
      # (same digest, same scan results -- nothing rebuilt), with tags
      # derived by swapping the registry host only; the image path
      # (owner/repo) is identical in both registries.
      - name: Copy manifest to Docker Hub
        run: |
          set -euo pipefail
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args+=(--tag "${tag/ghcr.io/docker.io}")
          done <<< "${{ steps.meta.outputs.tags }}"
          docker buildx imagetools create "${tag_args[@]}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.manifest.outputs.digest }}"

  # Runs only for a version-tag push (or release.yml's `--ref vX.Y.Z`
  # dispatch, or the equivalent manual fallback documented in
  # CONTRIBUTING.md -- all three set github.ref to the tag). Per AGENTS.md's
  # release process, a version tag is always cut from a commit already on
  # main, so the `build`/`manifest` jobs above have already built, scanned,
  # and published that exact commit under its `sha-<short>` tag by the time
  # this runs (or will shortly -- this waits for it). Promoting that
  # existing digest to the version tag -- instead of building again --
  # guarantees the release is byte-identical to what main already published,
  # and avoids the race this workflow used to have: two independent builds
  # of the same commit can produce different digests (the Dockerfile runs
  # `apt-get upgrade` at build time), so a main-triggered build and a
  # tag-triggered rebuild of the same commit were never guaranteed to agree,
  # even though they were meant to be "the same release".
  promote:
    name: Promote published image to release tag
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # 40, not the 10 the rest of this job actually needs: the wait step
    # below can legitimately poll for up to 30 of those minutes (matching
    # `build` + `manifest`'s own combined 15+10 minute timeouts, plus a
    # margin for queueing), and a job-level timeout shorter than its own
    # longest step doesn't extend the step -- it just kills the job mid-wait.
    timeout-minutes: 40
    # Per ref (a version tag), not per commit: unlike `build`/`manifest`
    # above, different releases always have different tags, so this never
    # needs cross-release ordering -- only retries of the *same* tag should
    # serialize against each other, which a per-ref group already does.
    concurrency:
      group: docker-publish-promote-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # imagetools inspect/create need a buildx builder context; no QEMU
      # needed since nothing is built here.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # docker/metadata-action's `type=sha,format=short` is the first 7 hex
      # characters of the full commit SHA (verified against a real published
      # tag: sha-cbd742c resolves to the same digest as latest, for a commit
      # starting cbd742c9...). github.sha in a tag-triggered run is the
      # commit the tag points at -- the same commit the main push for this
      # release already built -- so this is computed the same way here as
      # docker/metadata-action computed it for that earlier run, without
      # needing to query anything to reconstruct it.
      #
      # Polling instead of assuming the tag already exists: release.yml
      # dispatches this job right after creating the GitHub Release, which
      # can easily be faster than the separate `build`/`manifest` jobs
      # above (triggered by the same push, but a genuinely different,
      # unordered workflow run) finishing their own build and scan. Waits
      # up to 30 minutes, not 5: `build` alone allows 15 and `manifest`
      # (which needs: build, so it only starts after) allows another 10 --
      # a shorter wait here would time out a legitimately slow but healthy
      # build, leaving a real GitHub Release without its container tag or
      # SBOM for no actual reason.
      - name: Wait for the source image to be published
        id: source
        run: |
          set -euo pipefail
          source_tag="sha-${GITHUB_SHA:0:7}"
          source_ref="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${source_tag}"
          for _ in $(seq 1 180); do
            if digest="$(docker buildx imagetools inspect "$source_ref" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty')" && [ -n "$digest" ]; then
              echo "digest=$digest" >> "$GITHUB_OUTPUT"
              echo "Found ${source_ref} @ ${digest}"
              exit 0
            fi
            sleep 10
          done
          echo "::error::${source_ref} did not appear within 30 minutes -- the main-branch build for" \
               "this commit may have failed, or this commit predates this workflow's sha-tagging." \
               "Trigger a build for main (workflow_dispatch, no ref override) first, then retry." >&2
          exit 1

      # sha-<short> is only 7 hex characters; two different commits can
      # coincidentally share that prefix (more likely than it sounds as a
      # repo accumulates commits -- this is exactly why Git itself will grow
      # its own default abbreviation length over a repository's lifetime).
      # If a later, unrelated commit's build overwrote sha-<short> with a
      # different digest between this release's commit landing and this
      # step running, promoting that digest under this release's version
      # tag would silently ship the wrong commit's content. Every image
      # already carries its exact source commit in a standard OCI label
      # (org.opencontainers.image.revision, set automatically by
      # docker/metadata-action) -- verified against the currently published
      # `latest` image, whose label matches the commit that actually built
      # it. Comparing that label to github.sha here catches the collision
      # before anything is promoted under the wrong version tag.
      - name: Verify the resolved image was built from this commit
        env:
          DIGEST: ${{ steps.source.outputs.digest }}
        run: |
          set -euo pipefail
          revision="$(docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}" --format '{{json .Image}}' \
            | jq -r '.["linux/amd64"].config.Labels."org.opencontainers.image.revision" // empty')"
          if [ "$revision" != "${GITHUB_SHA}" ]; then
            echo "::error::Resolved digest ${DIGEST} (via sha-${GITHUB_SHA:0:7}) was built from commit" \
                 "${revision:-unknown}, not ${GITHUB_SHA}. The short-SHA tag may have been overwritten" \
                 "by a different commit sharing the same 7-character prefix -- refusing to promote a" \
                 "possibly-wrong image under this release's version tag." >&2
            exit 1
          fi
          echo "Verified: ${DIGEST} was built from ${GITHUB_SHA}."

      - name: Promote to GHCR and Docker Hub
        env:
          DIGEST: ${{ steps.source.outputs.digest }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          docker buildx imagetools create \
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${version}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"
          docker buildx imagetools create \
            --tag "${{ env.DOCKERHUB_IMAGE }}:${version}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

      # Reporting only, not a second Trivy gate: the digest being promoted
      # already passed the HIGH/CRITICAL gate in the build job above, and
      # nothing about its content changes here.
      - name: Generate CycloneDX SBOM (linux/amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.source.outputs.digest }}
          format: cyclonedx
          output: sbom-amd64.cdx.json

      - name: Generate CycloneDX SBOM (linux/arm64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.source.outputs.digest }}
          format: cyclonedx
          output: sbom-arm64.cdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom
          path: sbom-*.cdx.json
          retention-days: 90

      # release.yml creates the GitHub Release before dispatching this
      # workflow, so it should already exist -- but poll rather than assume,
      # for the manual-fallback path (a plain `git push origin vX.Y.Z` or a
      # bare `gh workflow run docker-publish.yml --ref vX.Y.Z`) where nothing
      # guarantees the release was created first.
      - name: Attach SBOM to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          for _ in $(seq 1 30); do
            if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              gh release upload "$TAG" sbom-amd64.cdx.json sbom-arm64.cdx.json --clobber --repo "${{ github.repository }}"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Release $TAG did not appear within 5 minutes; SBOM was not attached."
          exit 1
