name: Publish Container

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

# Grouped per ref, not per repository: a GitHub Actions concurrency group
# holds at most one *running* and one *pending* run, not a FIFO queue. A
# shared, repository-wide group would let a third, unrelated run (a `main`
# push arriving while a version-tag release is still queued behind an
# in-progress run) silently evict that queued release, so its versioned
# image and SBOM would simply never be built, with no error anywhere. Each
# ref getting its own group means a tag release can only ever be evicted by
# another push to that *same* ref, which doesn't happen for an immutable
# version tag. The accepted trade-off: a `main` push and a version-tag push
# landing close together run fully in parallel and could each try to write
# `:latest`, so it may briefly point at either one's content. `:latest` is
# already documented (README, SECURITY.md) as unsuitable for production use
# for this and other reasons; losing an entire release outright is worse.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKERHUB_IMAGE: docker.io/${{ github.repository }}

jobs:
  publish:
    name: Build and publish image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3  # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # DOCKERHUB_TOKEN is a Docker Hub access token (Account Settings ->
      # Security), not the account password. Same discipline as GITHUB_TOKEN
      # above: scoped, revocable, never the real credential.
      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `latest` is enabled only for `main`, never for a version tag. main
      # pushes share one concurrency group and so are already serialized
      # against each other, but a tag push runs in its OWN group (see the
      # concurrency comment above) — fully in parallel with any main push,
      # including one still writing `latest` to GHCR and Docker Hub in two
      # separate steps. With both refs eligible to write `latest`, their
      # GHCR and Docker Hub writes could interleave (e.g. main's GHCR write,
      # then tag's GHCR write, then tag's Docker Hub write, then main's
      # Docker Hub write) and leave the two registries' `latest` pointing at
      # different digests — silently breaking the same-image guarantee this
      # workflow otherwise provides. The release process (AGENTS.md) always
      # tags a commit that was already pushed to `main` first, so `main`'s
      # own run has already published `latest` for that exact content by the
      # time the tag exists; the tag push only needs to add its own
      # `vX.Y.Z`/`X.Y`/`sha-...` tags, not touch `latest` a second time.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Each platform is built exactly once, pushed by digest (unreferenced by
      # any tag yet), and that same digest is what gets scanned below. The
      # Dockerfile runs `apt-get upgrade` at build time, so a second, separate
      # "rebuild for push" step could resolve different package versions than
      # what was scanned — building once and reusing the digest avoids that
      # entirely, rather than relying on layer-cache reuse for identity.
      - name: Build & push linux/amd64 by digest
        id: build-amd64
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      # docker/build-push-action's reported digest is an OCI index (the real
      # image plus a separate build-provenance attestation manifest, added by
      # buildx's default provenance since v0.10) rather than a single image
      # manifest. Without TRIVY_PLATFORM, Trivy resolves a multi-manifest
      # reference by matching the scanning host's own platform: verified
      # locally that this works by luck for the amd64 digest on an amd64
      # runner, but fails outright for the arm64 digest ("no child with
      # platform linux/amd64 in index") since only linux/arm64 and the
      # unknown/unknown attestation entry exist there. Pinned explicitly on
      # both sides so neither depends on the runner's own architecture.
      - name: Trivy scan linux/amd64 (SARIF, always uploaded)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-amd64.outputs.digest }}
          format: sarif
          output: trivy-amd64.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true

      - uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4.36.2
        if: always()
        with:
          sarif_file: trivy-amd64.sarif
          category: trivy-amd64

      # Hard gate: fails the job, before the manifest below is ever created,
      # on fixable HIGH/CRITICAL findings (playbook's Tier 2 requirement).
      # The digest above already exists in the registry at this point, but
      # it isn't referenced by any tag, so it's unreachable to anyone
      # pulling `:latest` or a version tag.
      - name: Trivy gate linux/amd64 (fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-amd64.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Build & push linux/arm64 by digest
        id: build-arm64
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/arm64
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

      - name: Trivy scan linux/arm64 (SARIF, always uploaded)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-arm64.outputs.digest }}
          format: sarif
          output: trivy-arm64.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true

      - uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4.36.2
        if: always()
        with:
          sarif_file: trivy-arm64.sarif
          category: trivy-arm64

      - name: Trivy gate linux/arm64 (fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-arm64.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate CycloneDX SBOM (linux/amd64)
        if: startsWith(github.ref, 'refs/tags/')
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-amd64.outputs.digest }}
          format: cyclonedx
          output: sbom-amd64.cdx.json

      - name: Generate CycloneDX SBOM (linux/arm64)
        if: startsWith(github.ref, 'refs/tags/')
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-arm64.outputs.digest }}
          format: cyclonedx
          output: sbom-arm64.cdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: sbom
          path: sbom-*.cdx.json
          retention-days: 90

      # Only reached once both platforms' gates above passed. Composes the
      # real, user-visible tags (latest, version tags, ...) directly from the
      # two already-scanned digests — never a rebuild. --metadata-file
      # captures the merged manifest's own digest so the Docker Hub copy
      # below has a stable, precise reference instead of re-reading a
      # floating tag that a concurrent run could have already moved.
      - name: Create and push multi-arch manifest (GHCR)
        id: manifest
        run: |
          set -euo pipefail
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args+=(--tag "$tag")
          done <<< "${{ steps.meta.outputs.tags }}"
          docker buildx imagetools create --metadata-file manifest.json "${tag_args[@]}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-amd64.outputs.digest }}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-arm64.outputs.digest }}"
          digest="$(jq -r '."containerimage.descriptor".digest // empty' manifest.json)"
          [ -n "$digest" ] || { echo "::error::could not resolve merged manifest digest from metadata file"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Docker Hub is never a build target: BuildKit's image exporter takes
      # one `name=` per invocation, so a second registry can't be fanned out
      # to from the per-platform builds above without building twice. This
      # is a registry-to-registry copy of the exact manifest GHCR just
      # received (same digest, same scan results — nothing rebuilt), with
      # tags derived by swapping the registry host only; the image path
      # (owner/repo) is identical in both registries.
      - name: Copy manifest to Docker Hub
        run: |
          set -euo pipefail
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args+=(--tag "${tag/ghcr.io/docker.io}")
          done <<< "${{ steps.meta.outputs.tags }}"
          docker buildx imagetools create "${tag_args[@]}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.manifest.outputs.digest }}"

      # release.yml also triggers on this same tag push and creates the
      # GitHub Release independently; wait for it rather than assuming it
      # already exists, so this doesn't lose the race on a fast runner.
      - name: Attach SBOM to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          for _ in $(seq 1 30); do
            if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              gh release upload "$TAG" sbom-amd64.cdx.json sbom-arm64.cdx.json --clobber --repo "${{ github.repository }}"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Release $TAG did not appear within 5 minutes; SBOM was not attached."
          exit 1
