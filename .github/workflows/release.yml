name: Release

on:
  push:
    tags: ["v*"]

# Grouped per ref (per tag), not per repository, for the same reason as
# docker-publish.yml: a repo-wide group only holds one pending run, so a
# third tag pushed while an earlier tag's release is still running would
# silently evict the middle tag's queued run. That tag would then never get
# a GitHub Release, and docker-publish.yml's SBOM-attach step (which polls
# for this workflow's release to exist) would time out waiting for it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"

      - name: Build formatted release notes
        id: notes
        run: |
          python scripts/format_release_notes.py "${GITHUB_REF_NAME}" > /tmp/release-notes.md
          echo "path=/tmp/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          body_path: /tmp/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
