name: Release

on:
  push:
    tags: ["v*"]

# Grouped per ref (per tag), not per repository, for the same reason as
# docker-publish.yml: a repo-wide group only holds one pending run, so a
# third tag pushed while an earlier tag's release is still running would
# silently evict the middle tag's queued run. That tag would then never get
# a GitHub Release, and docker-publish.yml's SBOM-attach step (which polls
# for this workflow's release to exist) would time out waiting for it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Build formatted release notes
        id: notes
        run: |
          python scripts/format_release_notes.py "${GITHUB_REF_NAME}" > /tmp/release-notes.md
          echo "path=/tmp/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          body_path: /tmp/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
